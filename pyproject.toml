[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-agent"
version = "0.4.0"
description = "循迹（Trace） - 个人版游戏开发智能体 (设计 v0.3.1 实现)"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "argon2-cffi>=23.1",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
oidc = ["authlib>=1.3", "cryptography>=42.0"]

[project.scripts]
game-agent = "game_agent.main:main"

[tool.setuptools.packages.find]
include = ["game_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: 端到端冒烟（真跑一整轮 MockBrain run，约 1–2 分钟）；用 -m 'not slow' 跳过",
]
