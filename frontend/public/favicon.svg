<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    循迹 Trace 品牌图标（母版，1024×1024）
    - 外形用 Windows 11 风格的圆角方块（squircle 近似，圆角率 ≈22%），小尺寸下比满圆更清晰；
    - 蓝→青品牌渐变保留；内部白手柄做「粗线条、低细节」，16px 仍能认出是手柄；
    - 细节（十字键/按键）用深蓝落在白底上，避免细渐变在缩小后糊成一片。
    生成物：favicon.svg / favicon.ico(16..256) / favicon-32.png / apple-touch-icon.png / Trace.exe 图标
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B8BFF"/>
      <stop offset="0.55" stop-color="#2F7DDF"/>
      <stop offset="1" stop-color="#19C2A8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0b1a35" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块底 -->
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#tile)"/>
  <!-- 内高光/暗角，增加层级但不引入细碎细节 -->
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#gloss)"/>
  <!-- 细描边，深色背景下也能和桌面区分 -->
  <rect x="48" y="48" width="928" height="928" rx="210" fill="none"
        stroke="#ffffff" stroke-opacity="0.20" stroke-width="6"/>

  <!-- 手柄主体（白色粗胶囊，比例更接近方，避免小尺寸读成“眼镜/脸”） -->
  <rect x="236" y="352" width="552" height="320" rx="160" fill="url(#pad)"/>

  <!-- 左侧十字键（大号，16px 也认得出） -->
  <g fill="#1E5FC8">
    <rect x="386" y="404" width="76" height="216" rx="26"/>
    <rect x="316" y="474" width="216" height="76" rx="26"/>
  </g>

  <!-- 右侧按键：一颗大圆点（A 键），单一圆比两颗更像手柄、不似眼睛 -->
  <circle cx="650" cy="512" r="66" fill="#1E5FC8"/>
</svg>
